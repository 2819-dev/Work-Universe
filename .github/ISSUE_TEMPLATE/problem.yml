name: Report a problem
description: Something in QuickSnip isn't working as expected.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to let us know. A few details help us fix it quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: version
    attributes:
      label: QuickSnip and macOS version
      description: In QuickSnip, open ••• → Support and click Copy next to the version details, then paste them here.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If it helps, drag screenshots into this box.
