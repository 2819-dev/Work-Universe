name: Build Mac app

# Every push to main builds and tests the app.
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the .zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          app/build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Snippet-Menu
          path: app/build/Snippet-Menu.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/Snippet-Menu.zip \
            --title "Snippet Menu $GITHUB_REF_NAME" \
            --notes-file app/RELEASE_NOTES.md
