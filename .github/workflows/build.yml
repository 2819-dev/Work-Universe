name: Build Mac app

# Every push to main builds and tests the app.
# To publish a GitHub Release with the .zip, change the number in app/VERSION
# (e.g. 1.0.0 -> 1.0.1) and push to main. A release is made for each new
# number. You can also push a tag like v1.0.1, or run this workflow by hand
# (Actions tab > Build Mac app > Run workflow) and type a version number.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then VERSION="${INPUT_VERSION#v}"
          else VERSION="$(tr -d '[:space:]' < app/VERSION)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          app/build.sh "$VERSION"

      - name: Launch check and preview screenshots
        run: |
          BIN="app/build/Snippet Menu.app/Contents/MacOS/SnippetMenu"
          mkdir -p previews
          "$BIN" & PID=$!
          sleep 6
          kill -0 $PID || { echo "The app quit unexpectedly at launch"; exit 1; }
          screencapture -x previews/1-categories.png || true
          head -3 "$HOME/Library/Application Support/Snippet Menu/snippets.txt"
          kill $PID; sleep 1
          SNIPPETMENU_SHOW_PANEL=category "$BIN" & PID=$!
          sleep 6
          kill -0 $PID || { echo "The app quit unexpectedly"; exit 1; }
          screencapture -x previews/2-category.png || true
          kill $PID
          # Small copies of the previews, printed for review in the build log.
          for f in previews/*.png; do
            sips -s format jpeg -s formatOptions 55 -Z 1100 "$f" --out "${f%.png}.jpg" >/dev/null || continue
            echo "=== PREVIEW $(basename "$f") ==="
            base64 -i "${f%.png}.jpg" | fold -w 1000
            echo "=== END PREVIEW ==="
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Snippet-Menu
          path: app/build/Snippet-Menu.zip

      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Change app/VERSION to publish a new one."
            exit 0
          fi
          gh release create "v$VERSION" app/build/Snippet-Menu.zip \
            --target "$GITHUB_SHA" \
            --title "Snippet Menu v$VERSION" \
            --notes-file app/RELEASE_NOTES.md
