name: Build Mac app

# Every push to main builds and tests the app.
# To publish a GitHub Release with the .zip, either push a tag like v1.0.0,
# or run this workflow by hand (Actions tab > Build Mac app > Run workflow)
# and type a version number.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then VERSION="${INPUT_VERSION#v}"
          else VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          app/build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Snippet-Menu
          path: app/build/Snippet-Menu.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" app/build/Snippet-Menu.zip \
            --target "$GITHUB_SHA" \
            --title "Snippet Menu v$VERSION" \
            --notes-file app/RELEASE_NOTES.md
