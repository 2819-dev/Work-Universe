name: Build Mac app

# Every push to main builds and tests the app.
# To publish a GitHub Release with the .zip, change the number in app/VERSION
# (e.g. 1.0.0 -> 1.0.1) and push to main. A release is made for each new
# number. You can also push a tag like v1.0.1, or run this workflow by hand
# (Actions tab > Build Mac app > Run workflow) and type a version number.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then VERSION="${INPUT_VERSION#v}"
          else VERSION="$(tr -d '[:space:]' < app/VERSION)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          app/build.sh "$VERSION"

      - name: Launch check and preview screenshots
        run: |
          BIN="app/build/QuickSnip.app/Contents/MacOS/QuickSnip"
          LIBRARY_DIR="$HOME/Library/Application Support/QuickSnip"
          mkdir -p previews
          cp app/build/icon.png previews/icon.png
          # First launch: a new, empty library.
          "$BIN" & PID=$!
          sleep 6
          kill -0 $PID || { echo "The app quit unexpectedly at launch"; exit 1; }
          screencapture -x previews/0-first-launch.png || true
          kill $PID; sleep 1
          cat "$LIBRARY_DIR/snippets.txt"
          # Fill the library with example content for the remaining previews.
          defaults write io.github.2819-dev.snippetmenu removedSampleSnippets -bool true
          cp app/Resources/sample-1.1.txt "$LIBRARY_DIR/snippets.txt"
          cp app/Tests/preview/quick-snippets.json app/Tests/preview/shortcuts.json "$LIBRARY_DIR/"
          QUICKSNIP_PREVIEW=home QUICKSNIP_PREVIEW_UPDATE=1 "$BIN" & PID=$!
          sleep 6
          kill -0 $PID || { echo "The app quit unexpectedly"; exit 1; }
          screencapture -x previews/1-home.png || true
          kill $PID; sleep 1
          for page in folder add subfolder notepad shortcuts about support; do
            QUICKSNIP_PREVIEW=$page "$BIN" & PID=$!
            sleep 6
            kill -0 $PID || { echo "The app quit unexpectedly on $page"; exit 1; }
            screencapture -x "previews/2-$page.png" || true
            kill $PID; sleep 1
          done

      - name: Test renaming from Snippet Menu
        continue-on-error: true
        run: |
          mkdir -p "$HOME/RenameTest"
          cp -R app/build/QuickSnip.app "$HOME/RenameTest/Snippet Menu.app"
          open "$HOME/RenameTest/Snippet Menu.app"
          sleep 10
          ls "$HOME/RenameTest"
          pgrep -fl "RenameTest/QuickSnip.app" && echo "Renamed app reopened" || echo "Renamed app did not reopen"
          pkill -f "RenameTest/" || true
          [[ -d "$HOME/RenameTest/QuickSnip.app" && ! -e "$HOME/RenameTest/Snippet Menu.app" ]]

      - name: Test installing an update
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(gh release view --json tagName -q .tagName)"; LATEST="${LATEST#v}"
          TEST_APP="$HOME/UpdateTest/QuickSnip.app"
          mkdir -p "$HOME/UpdateTest"
          cp -R app/build/QuickSnip.app "$TEST_APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.1.0" "$TEST_APP/Contents/Info.plist"
          codesign --force --deep --sign - "$TEST_APP"
          QUICKSNIP_TEST_AUTO_UPDATE=1 "$TEST_APP/Contents/MacOS/QuickSnip" &
          sleep 30
          INSTALLED="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$TEST_APP/Contents/Info.plist")"
          echo "Latest release: $LATEST, installed after update: $INSTALLED"
          pgrep -fl "UpdateTest/" && echo "Updated app reopened" || echo "Updated app did not reopen"
          pkill -f "UpdateTest/" || true
          [[ "$INSTALLED" == "$LATEST" ]]

      - name: Save previews for review
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd previews
          git init -q -b ci-previews
          git add *.png
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Preview screenshots"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-previews

      - uses: actions/upload-artifact@v4
        with:
          name: QuickSnip
          path: app/build/QuickSnip.zip

      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Change app/VERSION to publish a new one."
            exit 0
          fi
          # Snippet-Menu.zip is the same download, for versions before the rename.
          gh release create "v$VERSION" app/build/QuickSnip.zip app/build/Snippet-Menu.zip \
            --target "$GITHUB_SHA" \
            --title "QuickSnip $VERSION" \
            --notes-file app/RELEASE_NOTES.md
